apiVersion: v1
kind: Service
metadata:
  name: slack-copilot-redis
  namespace: slack-copilot-agent
  labels:
    app.kubernetes.io/name: slack-copilot-redis
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  selector:
    app.kubernetes.io/name: slack-copilot-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slack-copilot-redis
  namespace: slack-copilot-agent
  labels:
    app.kubernetes.io/name: slack-copilot-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: slack-copilot-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slack-copilot-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
