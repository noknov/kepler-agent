apiVersion: apps/v1
kind: Deployment
metadata:
  name: slack-copilot-agent
  namespace: slack-copilot-agent
  labels:
    app.kubernetes.io/name: slack-copilot-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: slack-copilot-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slack-copilot-agent
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: slack-copilot-agent
          image: ghcr.io/your-org/slack-copilot-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: slack-copilot-agent-secrets
          env:
            - name: HTTP_ADDR
              value: ":8080"
            - name: LLM_PROVIDER
              value: "mimo"
            - name: ALLOWED_SLACK_USERS
              valueFrom:
                secretKeyRef:
                  name: slack-copilot-agent-secrets
                  key: ALLOWED_SLACK_USERS
                  optional: true
            - name: SLACK_EVENT_TIMEOUT
              value: "15m"
            - name: SLACK_EVENT_INBOX_LEASE
              value: "16m"
            - name: HTTP_SHUTDOWN_TIMEOUT
              value: "90s"
            - name: POSTGRES_MAX_CONNS
              value: "4"
            - name: RAG_BACKGROUND_INDEX
              value: "false"
            - name: WORKSPACE_AUTO_FETCH
              value: "false"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "curl -fsS -X POST http://127.0.0.1:8080/drain || true; sleep 10"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
