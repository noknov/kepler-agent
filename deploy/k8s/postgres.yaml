apiVersion: v1
kind: Service
metadata:
  name: slack-copilot-postgres
  namespace: slack-copilot-agent
  labels:
    app.kubernetes.io/name: slack-copilot-postgres
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app.kubernetes.io/name: slack-copilot-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: slack-copilot-postgres
  namespace: slack-copilot-agent
  labels:
    app.kubernetes.io/name: slack-copilot-postgres
spec:
  serviceName: slack-copilot-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: slack-copilot-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slack-copilot-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: slack_copilot
            - name: POSTGRES_PASSWORD
              value: slack_copilot
            - name: POSTGRES_DB
              value: slack_copilot
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "slack_copilot", "-d", "slack_copilot"]
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "slack_copilot", "-d", "slack_copilot"]
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
