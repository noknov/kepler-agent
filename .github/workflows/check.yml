name: Check

on:
  pull_request:
  push:
    branches: [main, feat/agent-v2]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: kepler
          POSTGRES_PASSWORD: kepler
          POSTGRES_DB: kepler_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kepler -d kepler_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/cli/pnpm-lock.yaml
      - name: Install local tool dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap postgresql-client redis-tools ripgrep

      - name: Initialize integration database
        env:
          PGPASSWORD: kepler
        run: psql -h 127.0.0.1 -U kepler -d kepler_test -v ON_ERROR_STOP=1 -f schema/postgres.sql
      - name: Structural change evidence
        env:
          REPORT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          REPORT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$REPORT_BASE" ] || [ "$REPORT_BASE" = "0000000000000000000000000000000000000000" ]; then
            mkdir -p .cache
            printf '%s\n' '{"available":false,"reason":"event has no comparison commit"}' > .cache/change-report.json
            exit 0
          fi
          python3 scripts/repository.py report --base "$REPORT_BASE" --head "$REPORT_HEAD" --output .cache/change-report.json
      - name: Upload structural change evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: change-report
          path: .cache/change-report.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Format and repository contracts
        run: make fmt-check repo-check
      - name: Agent environment diagnostics
        run: python3 scripts/repository.py doctor --ui
      - name: Static analysis
        run: make vet
      - name: Unit tests
        run: make test
      - name: PostgreSQL, Redis, and Linux sandbox integration tests
        env:
          POSTGRES_TEST_DSN: postgres://kepler:kepler@127.0.0.1:5432/kepler_test?sslmode=disable
          REDIS_TEST_URL: redis://127.0.0.1:6379/15
          SANDBOX_INTEGRATION: "1"
        run: go test ./gateway ./packages/profiles/hosted ./packages/profiles/local ./packages/connections ./observability
      - name: Slack product regressions with durable control stores
        env:
          POSTGRES_TEST_DSN: postgres://kepler:kepler@127.0.0.1:5432/kepler_test?sslmode=disable
          REDIS_TEST_URL: redis://127.0.0.1:6379/15
        run: make eval-slack SLACK_EVAL_FLAGS=-json > slack-regressions.jsonl
      - name: Upload Slack regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slack-regressions
          path: slack-regressions.jsonl
          if-no-files-found: ignore
      - name: Build deployable binaries
        run: make build
      - name: Validate CLI protocol boundary and bundle
        working-directory: apps/cli
        run: pnpm install --frozen-lockfile && pnpm typecheck && pnpm test
      - name: Web interaction regressions
        run: node --test packages/surfaces/web/tests/*.test.mjs observability/tests/*.test.mjs
      - name: Verify generated protocol artifacts
        run: make protocol-check
      - name: Validate evaluation tooling
        run: make eval-check
      - name: Race-sensitive runtime tests
        run: make test-race
