name: architecture-pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: architecture-pages
  cancel-in-progress: true

jobs:
  deploy:
    # Manual runs publish the selected branch, including feature branches.
    if: github.repository == 'noknov/kepler-agent'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate architecture site
        run: test -s architecture-site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: architecture-site
      - name: Deploy architecture guide
        id: deployment
        uses: actions/deploy-pages@v4
