provider = "openai"
protocol = "responses"
model = "controlled-model"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
reasoning_effort = "high"
input_routing = "steer"
output = "text"
# Zero means unlimited. Use Ctrl-C / the UI stop control to cancel a turn.
max_steps = 0
max_output_tokens = 16384
temperature = 0
unsafe_allow_no_sandbox = false

# Select a profile with: kepler-agent --profile deepseek
# The API key itself remains in the named environment variable.
[profiles.deepseek]
provider = "deepseek"
protocol = "openai"
model = "deepseek-chat"
base_url = "https://api.deepseek.com/v1"
api_key_env = "DEEPSEEK_API_KEY"

[profiles.anthropic]
provider = "anthropic"
protocol = "anthropic"
model = "claude-sonnet-4-5"
base_url = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"

# Readable by sandboxed commands in addition to the workspace. Keep this small.
additional_read_roots = []

# External, user-owned prompt overlays. Do not point this at secret files.
prompt_files = []

# Each root contains <skill-name>/SKILL.md.
skill_roots = []

# MCP tools are discovered at startup and deferred from model context until used.
# Effects default to external_write when omitted, so calls require approval.
# [[mcp_servers]]
# name = "clickstack"
# url = "https://mcp.clickhouse.cloud/clickstack"
# effects = ["read"]
# [mcp_servers.headers]
# x-service-id = "your-service-id"
