apiVersion: apps/v1
kind: Deployment
metadata:
  name: slack-copilot-gateway
  namespace: slack-copilot-agent
  labels:
    app.kubernetes.io/name: slack-copilot-gateway
    app.kubernetes.io/part-of: slack-copilot-agent
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: slack-copilot-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slack-copilot-gateway
        app.kubernetes.io/part-of: slack-copilot-agent
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: gateway
          image: ghcr.io/your-org/slack-copilot-agent:latest
          imagePullPolicy: IfNotPresent
          command: ["/app/slack-copilot-gateway"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: slack-copilot-gateway-secrets
          env:
            - name: HTTP_ADDR
              value: ":8080"
            - name: POSTGRES_MAX_CONNS
              value: "4"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "curl -fsS -X POST http://127.0.0.1:8080/drain || true; sleep 5"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
