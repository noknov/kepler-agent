apiVersion: apps/v1
kind: Deployment
metadata:
  name: slack-copilot-worker
  namespace: slack-copilot-agent
  labels:
    app.kubernetes.io/name: slack-copilot-worker
    app.kubernetes.io/part-of: slack-copilot-agent
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: slack-copilot-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slack-copilot-worker
        app.kubernetes.io/part-of: slack-copilot-agent
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: ghcr.io/your-org/slack-copilot-agent:latest
          imagePullPolicy: IfNotPresent
          command: ["/app/slack-copilot-worker"]
          envFrom:
            - secretRef:
                name: slack-copilot-worker-secrets
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
